<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSync - Search Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <nav class="sidebar app-sidebar">
    <div class="logo">
      <h1>SkillSync</h1>
    </div>
    <ul class="nav-links">
      <li><a href="/dashboard.html">My Dashboard</a></li>
      <li><a href="/events.html">Find Events (Match)</a></li>
      <li class="active"><a href="/search.html">Search Users</a></li>
      <li><a href="/browse-teams.html">Browse Teams</a></li>
      <li><a href="/teams.html">Teams & Invites</a></li>
      <li><a href="/analytics.html">Analytics</a></li>
      <li class="logout"><a href="#" id="logout-btn">Log Out</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <header>
      <h2>Search Students</h2>
    </header>

    <div class="filters-bar" style="margin-bottom: 2rem; display:flex; gap:1rem;">
        <input type="text" id="search-input" placeholder="Search by name or department..." class="search-input" />
        <button class="btn primary-btn" id="search-btn" style="width:auto;">Search</button>
        <button class="btn secondary-btn" id="filter-no-team-btn" style="width:auto;">Students Without Team</button>
    </div>

    <!-- Users List (Queries: LIKE search, Students without team) -->
    <div id="users-grid" class="content-grid events-grid">
        <div id="search-loading" class="loading-state" style="display:none;">Searching...</div>
        <div id="users-results" style="display:flex; flex-direction:column; gap:1rem; width:100%; grid-column: 1 / -1;">
            <p style="color:var(--text-muted);">Enter a search term to find users.</p>
        </div>
    </div>
  </main>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
